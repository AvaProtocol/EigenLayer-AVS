name: 'Setup Test Configuration'
description: 'Generate config/test.yaml for CI unit tests'
inputs:
  chain-endpoint:
    description: 'Chain RPC endpoint domain (e.g., sepolia.infura.io/v3/KEY)'
    required: true
  bundler-rpc:
    description: 'Bundler RPC URL'
    required: true
  tenderly-account:
    description: 'Tenderly account name'
    required: true
  tenderly-project:
    description: 'Tenderly project name'
    required: true
  controller-private-key:
    description: 'Controller private key'
    required: true
  tenderly-access-key:
    description: 'Tenderly access key'
    required: true
  owner-eoa:
    description: 'Owner EOA address for test smart wallet derivation (controller signs UserOps)'
    required: true
  test-private-key:
    description: |
      Private key for the owner EOA. Under MA v2 the gateway holds no
      authority until the owner signs a session grant, and only the owner's
      key can sign one — so live tests need the key, not just owner-eoa.
      Optional: jobs that do not run live tests (e.g. lint) can omit it.
    required: false
  moralis-api-key:
    description: 'Moralis Web3 Data API key for token balance integration tests'
    required: false
runs:
  using: 'composite'
  steps:
    - name: Generate and verify config/test.yaml
      env:
        # Unified environment variables
        CHAIN_ENDPOINT: "${{ inputs.chain-endpoint }}"
        BUNDLER_RPC: "${{ inputs.bundler-rpc }}"

        # Tenderly HTTP API credentials
        TENDERLY_ACCOUNT: "${{ inputs.tenderly-account }}"
        TENDERLY_PROJECT: "${{ inputs.tenderly-project }}"

        # Secrets
        CONTROLLER_PRIVATE_KEY: "${{ inputs.controller-private-key }}"
        TENDERLY_ACCESS_KEY: "${{ inputs.tenderly-access-key }}"
        OWNER_EOA: "${{ inputs.owner-eoa }}"
        MORALIS_API_KEY: "${{ inputs.moralis-api-key }}"
      shell: bash
      run: ./.github/scripts/generate-test-config.sh

    # The live-test fixtures read TEST_PRIVATE_KEY from the ENVIRONMENT
    # (os.Getenv), not from config/test.yaml — so export it to the job so
    # every later step sees it. Referenced via $env, not interpolated into
    # the script body, so the secret never appears verbatim in the command.
    - name: Export the owner key to the job environment
      if: ${{ inputs.test-private-key != '' }}
      shell: bash
      env:
        TEST_PRIVATE_KEY: "${{ inputs.test-private-key }}"
      run: echo "TEST_PRIVATE_KEY=${TEST_PRIVATE_KEY}" >> "$GITHUB_ENV"
