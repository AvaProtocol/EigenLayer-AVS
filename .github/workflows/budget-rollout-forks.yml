name: Budget rollout fork proofs

on:
  pull_request:
    branches: [staging, main]
    paths:
      - "core/taskengine/budget_*.go"
      - "core/taskengine/session_permissions.go"
      - "core/taskengine/testdata/wallet_budget_rollout/**"
      - "core/taskengine/tokenwhitelist/**"
      - "core/config/budget_*.go"
      - "core/config/config.go"
      - "core/chainio/aa/**"
      - "pkg/erc4337/**"
      - ".github/workflows/budget-rollout-forks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  atomic-budget-fork:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    name: Atomic budget fork (${{ matrix.chain }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        chain: [1, 8453]
    env:
      ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}
      WALLET_BUDGET_MAINNET_FORK: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.2.3
      - name: Prove reset, rollback and owner/session signatures on the pinned fork
        # Public fork-only keys; no owner/controller key and no broadcast path.
        run: go test -tags integration ./core/taskengine -run '^TestBudgetAtomicResetAndInstall_MainnetForks/${{ matrix.chain }}$' -count=1 -v -timeout 30m
