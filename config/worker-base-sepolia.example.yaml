# Worker configuration TEMPLATE for Base Sepolia (chain 84532).
#
# This is a checked-in template. The real file is gitignored — copy it
# and fill in the placeholder values:
#
#   cp config/worker-base-sepolia.example.yaml config/worker-base-sepolia.yaml
#   $EDITOR config/worker-base-sepolia.yaml
#
# Handles chain-specific execution: UserOps, contract writes, token
# enrichment. Stateless — no local DB (gateway owns storage).
environment: development

chain_id:   84532
chain_name: base-sepolia

# Internal gRPC listen address (gateway connects here).
# In production (Railway): worker-base-sepolia.railway.internal:50051
listen_address: "0.0.0.0:50052"

# Health check endpoint (Railway requires HTTP health checks).
health_address: "0.0.0.0:8091"

# Gateway address (worker registers with gateway on startup).
gateway_address: "127.0.0.1:2206"

# Chain RPC endpoints (Base Sepolia). Set via .env.local / env.
# Supply a chain RPC you control. Do NOT point this at a free public endpoint
# (publicnode, *.base.org, ankr, llamarpc, ...): they rate-limit under load,
# which makes runs fail nondeterministically on whichever request happens to be
# in flight rather than on anything real.
eth_rpc_url: ${BASE_SEPOLIA_RPC_URL}
eth_ws_url:  ${BASE_SEPOLIA_WS_URL}

# Bundler endpoint. bundler_provider defaults to 'alchemy' in code (URL derived
# from alchemy_api_key); pinned to self_hosted here so this worker uses bundler_url.
# Set 'alchemy' + ALCHEMY_API_KEY to route via Alchemy instead.
# Set the BASE_SEPOLIA_BUNDLER_URL env var via .env.local before launching.
bundler_url:      ${BASE_SEPOLIA_BUNDLER_URL}
bundler_provider: self_hosted
alchemy_api_key:  ${ALCHEMY_API_KEY}

# Gas Manager sponsorship — MUST match the gateway, or this worker sends
# UNSPONSORED operations.
#
# Sponsorship is requested only when a policy id is present. Without one, every
# operation this worker sends has to be paid for out of the smart wallet's own
# balance, so a wallet holding only tokens cannot move them — which is how
# withdrawals routed through a worker silently stopped being sponsored (#722).
#
# The webhook endpoint itself stays on the gateway (POST /webhooks/gas-manager).
# What the worker needs is the SECRET: it is echoed to Alchemy as webhookData,
# and the gateway's webhook rejects any request whose value does not match.
alchemy_paymaster_policy_id: ${ALCHEMY_PAYMASTER_POLICY_ID}
gas_manager_webhook_secret:  ${GAS_MANAGER_WEBHOOK_SECRET}

# Smart wallet / account abstraction config.
smart_wallet:
  controller_private_key: <testnet-controller-private-key-hex>
  paymaster_address:      0xd856f532F7C032e6b30d76F19187F25A068D6d92
